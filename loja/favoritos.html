<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os meus favoritos — Roque Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
<script src="../assets/store-common.js"></script>
<style>
  :root{
    --bg:#0A0603; --bg-2:#160D07; --surface:#20140A;
    --brown:#4A2A18; --brown-light:#6B3D22; --brown-deep:#1B0F07;
    --gold:#C08A3E; --gold-light:#E0B173;
    --text:#F4ECE1; --text-soft:#B9A48C; --line:#3A2A1A;
    --shadow:0 14px 34px -14px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding-bottom:calc(70px + env(safe-area-inset-bottom)); }
  h1,h2{ font-family:'Fraunces',serif; color:var(--text); font-weight:600; }
  a{ color:inherit; text-decoration:none; }
  button{ font-family:inherit; cursor:pointer; border:none; }
  img{ max-width:100%; display:block; }

  .top-header{ background:var(--brown-deep); border-bottom:1.5px solid var(--gold); padding:16px 20px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:50; }
  .top-header a.back{ font-size:20px; }
  .top-header h1{ font-size:19px; }

  main{ max-width:700px; margin:0 auto; padding:20px 18px 40px; }

  .empty{ text-align:center; padding:70px 20px; color:var(--text-soft); }
  .empty .ic{ font-size:50px; margin-bottom:16px; }
  .empty a{ display:inline-block; margin-top:18px; color:var(--gold-light); font-weight:700; border-bottom:1.5px solid var(--gold); padding-bottom:2px; }

  .fav-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .prod-card{ background:var(--surface); border:1.5px solid var(--gold); border-radius:16px; overflow:hidden; position:relative; }
  .prod-img{ height:130px; background:var(--bg-2); display:flex; align-items:center; justify-content:center; font-size:42px; position:relative; }
  .prod-fav{ position:absolute; top:9px; right:9px; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text); }
  .prod-body{ padding:13px 14px 15px; }
  .prod-name{ font-size:13.5px; font-weight:700; margin-bottom:3px; }
  .prod-brand{ font-size:11px; color:var(--text-soft); margin-bottom:8px; }
  .prod-price-row{ display:flex; align-items:center; justify-content:space-between; }
  .prod-price{ font-weight:700; font-size:14px; color:var(--gold-light); }
  .prod-add{ width:29px; height:29px; border-radius:50%; background:var(--brown-light); border:1px solid var(--gold); color:var(--text); font-size:15px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .prod-add:hover{ background:var(--gold); }
</style>
</head>
<body>

<header class="top-header">
  <a href="index.html" class="back">←</a>
  <h1>Os meus favoritos</h1>
</header>

<main>
  <div id="favView"></div>
</main>

<script>
  function render(){
    const favs = RD.getFavs();
    const view = document.getElementById('favView');

    if(favs.length === 0){
      view.innerHTML = `
        <div class="empty">
          <div class="ic">🤍</div>
          <h2>Ainda não tens favoritos</h2>
          <p>Toca no coração de um produto para o guardares aqui.</p>
          <a href="index.html">← Voltar à loja</a>
        </div>`;
      return;
    }

    view.innerHTML = `<div class="fav-grid">${favs.map(p => `
      <div class="prod-card">
        <div class="prod-img">
          ${p.image ? `<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;">` : (p.emoji || '📦')}
          <div class="prod-fav" onclick="remover('${p.id}')">❤️</div>
        </div>
        <div class="prod-body">
          <div class="prod-name">${p.name}</div>
          <div class="prod-brand">${p.brand || ''}</div>
          <div class="prod-price-row">
            <span class="prod-price">${RD.formatKz(p.price)}</span>
            <div class="prod-add" onclick="adicionar('${p.id}')">+</div>
          </div>
        </div>
      </div>
    `).join('')}</div>`;
  }

  function remover(id){
    const favs = RD.getFavs();
    const p = favs.find(f=>f.id===id);
    if(p) RD.toggleFavorite(p);
    render();
    RD.showToast('Removido dos favoritos');
  }

  function adicionar(id){
    const p = RD.getFavs().find(f=>f.id===id);
    if(p) RD.addToCart(p, 1);
    RD.showToast('Adicionado ao carrinho');
  }

  render();
</script>

</body>
</html>
