<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roque Digital — Acesso ao Painel</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 30% 20%, var(--brown-700), var(--brown-900) 65%); padding:20px; }
  .auth-box{ width:100%; max-width:400px; background:var(--white); border-radius:20px; padding:38px 34px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.5); }
  .auth-logo{ width:64px; height:64px; border-radius:50%; overflow:hidden; margin:0 auto 18px; border:3px solid var(--gold); }
  .auth-logo img{ width:100%; height:100%; object-fit:cover; }
  .auth-title{ text-align:center; font-size:21px; margin-bottom:4px; }
  .auth-sub{ text-align:center; font-size:13px; color:var(--text-soft); margin-bottom:26px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; color:var(--text-soft); margin-bottom:6px; }
  .field input{ width:100%; padding:11px 14px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; font-family:inherit; }
  .field input:focus{ outline:none; border-color:var(--brown-700); }
  .auth-btn{ width:100%; margin-top:6px; }
  .auth-foot{ text-align:center; font-size:13px; color:var(--text-soft); margin-top:20px; }
  .auth-foot a{ color:var(--brown-700); font-weight:700; }
  .msg{ font-size:12.5px; text-align:center; margin-top:14px; padding:10px; border-radius:8px; display:none; }
  .msg.error{ background:#FBEAE6; color:var(--danger); display:block; }
  .msg.ok{ background:#E4F3E9; color:var(--success); display:block; }
  .back-link{ position:fixed; top:20px; left:20px; color:var(--cream-2); font-size:13px; font-weight:600; opacity:.8; }
</style>
</head>
<body>

<a href="../loja/index.html" class="back-link">← Voltar à loja</a>

<div class="auth-box">
  <div class="auth-logo"><img src="../assets/logo.png" alt="Roque Digital"></div>
  <h1 class="auth-title" style="text-align:center;">Painel de Gestão</h1>
  <p class="auth-sub">Acesso restrito — Administradores e Gestores</p>

  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" required placeholder="oteuemail@exemplo.com">
    </div>
    <div class="field">
      <label>Palavra-passe</label>
      <input type="password" id="password" required placeholder="••••••••">
    </div>
    <button type="submit" class="btn btn-primary auth-btn">Entrar</button>
    <div id="msg" class="msg"></div>
  </form>

  <p class="auth-foot">Ainda não tens conta? <a href="signup.html">Criar conta de acesso</a></p>
</div>

<script>
  const SUPABASE_URL = "https://ijbkwdtooypmgngtuwpy.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqYmt3ZHRvb3lwbWduZ3R1d3B5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5ODM5NTgsImV4cCI6MjEwNDU1OTk1OH0.YQLmJrag4GT_EDes3t0SfzgGyAAsDl8z1FNnSWyys1Q";
  const supabase = SUPABASE_URL.startsWith("http") ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

  const form = document.getElementById('loginForm');
  const msg = document.getElementById('msg');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if(!supabase){
      msg.className = 'msg error';
      msg.textContent = 'Liga o Supabase primeiro (edita SUPABASE_URL e SUPABASE_ANON_KEY neste ficheiro).';
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if(error){
      msg.className = 'msg error';
      msg.textContent = 'Email ou palavra-passe incorretos.';
      return;
    }

    // Confirma que o utilizador tem um perfil com função admin ou gestor
    const { data: profile } = await supabase
      .from('profiles')
      .select('role, full_name')
      .eq('id', data.user.id)
      .single();

    if(!profile || (profile.role !== 'admin' && profile.role !== 'gestor')){
      msg.className = 'msg error';
      msg.textContent = 'Esta conta não tem permissão para aceder ao painel.';
      await supabase.auth.signOut();
      return;
    }

    msg.className = 'msg ok';
    msg.textContent = 'Sessão iniciada. A redirecionar...';
    setTimeout(()=>{ window.location.href = 'dashboard.html'; }, 700);
  });

  // Se já houver sessão ativa, vai direto ao dashboard
  (async ()=>{
    if(!supabase) return;
    const { data: { session } } = await supabase.auth.getSession();
    if(session) window.location.href = 'dashboard.html';
  })();
</script>

</body>
</html>
